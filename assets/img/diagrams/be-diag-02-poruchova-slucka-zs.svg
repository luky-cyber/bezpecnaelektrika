<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Čo tvorí poruchovú slučku Zs</title><desc id="desc">Didaktická schéma uzavretej elektrickej cesty pri poruche: od zdroja cez fázový vodič k miestu poruchy a späť ochrannou cestou k zdroju.</desc><style>.bg{fill:var(--diag-bg,#0f1821)}.wire{fill:none;stroke:var(--diag-accent,#68ddd4);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke:var(--diag-gold,#f0c56e);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.box{fill:var(--diag-surface,#13202b);stroke:var(--diag-line,rgba(174,211,218,.35));stroke-width:2}.h{font:800 28px Inter,system-ui,sans-serif;fill:var(--diag-text,#f1f6f7)}.lab{font:800 16px Inter,system-ui,sans-serif;fill:var(--diag-text,#f1f6f7)}.small{font:500 14px Inter,system-ui,sans-serif;fill:var(--diag-muted,#a0b2bc)}.accent{font:800 14px Inter,system-ui,sans-serif;fill:var(--diag-accent,#68ddd4)}.goldt{font:800 14px Inter,system-ui,sans-serif;fill:var(--diag-gold,#f0c56e)}</style><rect class="bg" width="980" height="500" rx="28"/><text class="h" x="48" y="58">Čo tvorí poruchovú slučku Zs?</text><text class="small" x="48" y="86">Zjednodušená schéma toku pri poruche. Konkrétna cesta závisí od sústavy a zapojenia.</text>
<rect class="box" x="58" y="170" width="160" height="120" rx="18"/><text class="lab" x="138" y="215" text-anchor="middle">Zdroj / sieť</text><text class="small" x="138" y="242" text-anchor="middle">napájacia časť</text><text class="small" x="138" y="262" text-anchor="middle">sústavy</text>
<rect class="box" x="408" y="160" width="170" height="140" rx="18"/><text class="lab" x="493" y="210" text-anchor="middle">Miesto poruchy</text><text class="small" x="493" y="238" text-anchor="middle">živá časť →</text><text class="small" x="493" y="258" text-anchor="middle">neživá vodivá časť</text>
<rect class="box" x="750" y="170" width="170" height="120" rx="18"/><text class="lab" x="835" y="215" text-anchor="middle">Ochranná cesta</text><text class="small" x="835" y="242" text-anchor="middle">PE/PEN a súvisiace</text><text class="small" x="835" y="262" text-anchor="middle">časti návratu</text>
<path class="wire" d="M218 210 H408"/><path d="M399 201 l16 9 -16 9z" fill="var(--diag-accent,#68ddd4)"/><text class="accent" x="312" y="192" text-anchor="middle">fázová cesta</text>
<path class="ret" d="M578 250 H750"/><path d="M741 241 l16 9 -16 9z" fill="var(--diag-gold,#f0c56e)"/><text class="goldt" x="664" y="233" text-anchor="middle">poruchový prúd</text>
<path class="ret" d="M835 290 V380 H138 V290"/><path d="M129 302 l9 -16 9 16z" fill="var(--diag-gold,#f0c56e)"/><text class="small" x="490" y="408" text-anchor="middle">návrat k zdroju cez ochrannú časť poruchovej slučky</text>
<rect class="box" x="264" y="438" width="452" height="40" rx="12"/><text class="small" x="490" y="463" text-anchor="middle">Zs opisuje impedanciu tejto elektrickej slučky — nie „odpor zásuvky“.</text></svg>