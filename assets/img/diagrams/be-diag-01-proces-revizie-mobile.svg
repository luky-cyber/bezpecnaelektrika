<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 980" role="img" aria-labelledby="title desc"><title id="title">Ako sa overuje elektrická inštalácia</title><desc id="desc">Päť navzájom sa doplňujúcich krokov: prehliadka, skúšanie, meranie, vyhodnotenie a dokumentácia.</desc><style>.bg{fill:var(--diag-bg,#0f1821)}.axis{stroke:var(--diag-line,rgba(174,211,218,.35));stroke-width:2}.n{fill:var(--diag-bg,#0f1821);stroke:var(--diag-accent,#68ddd4);stroke-width:3}.gold{stroke:var(--diag-gold,#f0c56e)}.ey{font:800 11px Inter,system-ui,sans-serif;letter-spacing:1.8px;fill:var(--diag-accent,#68ddd4)}.h{font:800 22px Inter,system-ui,sans-serif;fill:var(--diag-text,#f1f6f7)}.note,.body{font:500 12px Inter,system-ui,sans-serif;fill:var(--diag-muted,#a0b2bc)}.num{font:800 11px Inter,system-ui,sans-serif;fill:var(--diag-accent,#68ddd4)}.step{font:800 16px Inter,system-ui,sans-serif;fill:var(--diag-text,#f1f6f7)}.verb{font:700 12px Inter,system-ui,sans-serif;fill:var(--diag-accent,#68ddd4)}.band{fill:var(--diag-band,rgba(104,221,212,.08));stroke:var(--diag-line,rgba(174,211,218,.35))}</style><rect class="bg" width="360" height="980" rx="24"/><text class="ey" x="28" y="42">PROCES REVÍZIE</text><text class="h" x="28" y="76">Ako sa overuje</text><text class="h" x="28" y="104">elektrická inštalácia</text><text class="note" x="28" y="132">Kroky sa dopĺňajú. Žiadny sám nestačí.</text><line class="axis" x1="55" y1="190" x2="55" y2="804"/>
<g transform="translate(0,0)"><circle class="n" cx="55" cy="210" r="10"/><text class="num" x="82" y="194">01</text><text class="step" x="82" y="218">Prehliadka</text><text class="verb" x="82" y="240">vidieť</text><text class="body" x="82" y="262">Stav, zapojenie, označenia,</text><text class="body" x="82" y="279">viditeľné nedostatky.</text></g>
<g><circle class="n" cx="55" cy="350" r="10"/><text class="num" x="82" y="334">02</text><text class="step" x="82" y="358">Skúšanie</text><text class="verb" x="82" y="380">overiť</text><text class="body" x="82" y="402">Funkcie a ochranné prvky,</text><text class="body" x="82" y="419">nie iba pohľadom.</text></g>
<g><circle class="n" cx="55" cy="490" r="10"/><text class="num" x="82" y="474">03</text><text class="step" x="82" y="498">Meranie</text><text class="verb" x="82" y="520">získať údaje</text><text class="body" x="82" y="542">Číselné údaje o vybraných</text><text class="body" x="82" y="559">vlastnostiach.</text></g>
<g><circle class="n gold" cx="55" cy="630" r="11"/><circle cx="55" cy="630" r="4" fill="var(--diag-gold,#f0c56e)"/><text class="num" x="82" y="614" fill="var(--diag-gold,#f0c56e)">04</text><text class="step" x="82" y="638">Vyhodnotenie</text><text class="verb" x="82" y="660">dať význam</text><text class="body" x="82" y="682">Kontext inštalácie,</text><text class="body" x="82" y="699">nie izolované číslo.</text></g>
<g><circle class="n" cx="55" cy="770" r="10"/><text class="num" x="82" y="754">05</text><text class="step" x="82" y="778">Dokumentácia</text><text class="verb" x="82" y="800">zachytiť stav</text><text class="body" x="82" y="822">Zistenia, podmienky a záver</text><text class="body" x="82" y="839">v danom čase.</text></g>
<rect class="band" x="24" y="887" width="312" height="56" rx="14"/><text class="note" x="180" y="911" text-anchor="middle">Výsledok vzniká až spojením</text><text class="note" x="180" y="929" text-anchor="middle">týchto krokov.</text></svg>