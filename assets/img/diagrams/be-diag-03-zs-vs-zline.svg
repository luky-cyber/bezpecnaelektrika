<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<title>Zs nie je Zline</title><desc>Didaktické porovnanie poruchovej slučky Zs a napájacej slučky Zline. Zs používa ochrannú návratovú cestu, Zline pracovný vodič.</desc>
<style>.bg{fill:#0f1821}.box{fill:#13202b;stroke:#29424d;stroke-width:2}.t{fill:#f1f6f7;font-family:Inter,system-ui,sans-serif}.h{font-size:34px;font-weight:800}.m{font-size:19px;font-weight:700}.s{font-size:15px;fill:#a0b2bc}.a{fill:none;stroke:#68ddd4;stroke-width:6;stroke-linecap:round}.g{fill:none;stroke:#f0c56e;stroke-width:6;stroke-linecap:round}</style>
<rect class="bg" width="1000" height="560" rx="28"/><text class="t h" x="55" y="60">Zs ≠ Zline</text><text class="t s" x="55" y="92">Dve veličiny, dve rozdielne elektrické cesty.</text>
<rect class="box" x="55" y="135" width="410" height="325" rx="24"/><text class="t m" x="85" y="180">Zs · poruchová slučka</text><text class="t s" x="85" y="210">pracovný vodič → miesto poruchy</text><text class="t s" x="85" y="233">→ ochranná návratová cesta</text><circle cx="145" cy="295" r="34" fill="#162b31" stroke="#68ddd4" stroke-width="3"/><text class="t m" x="127" y="303">L</text><rect x="340" y="265" width="70" height="60" rx="12" fill="#162b31" stroke="#68ddd4" stroke-width="3"/><text class="t s" x="349" y="300">porucha</text><path class="a" d="M179 295 H340"/><path class="g" d="M375 325 V390 H145 V329"/><text class="t s" x="203" y="420">návrat cez ochrannú cestu</text>
<rect class="box" x="535" y="135" width="410" height="325" rx="24"/><text class="t m" x="565" y="180">Zline · napájacia slučka</text><text class="t s" x="565" y="210">pracovný vodič → záťaž/merací bod</text><text class="t s" x="565" y="233">→ pracovný vodič</text><circle cx="625" cy="295" r="34" fill="#162b31" stroke="#68ddd4" stroke-width="3"/><text class="t m" x="607" y="303">L</text><circle cx="855" cy="295" r="34" fill="#162b31" stroke="#68ddd4" stroke-width="3"/><text class="t m" x="837" y="303">N</text><path class="a" d="M659 295 H821"/><path class="a" d="M855 329 V390 H625 V329"/><text class="t s" x="678" y="420">návrat pracovným vodičom</text>
<text class="t s" x="55" y="515">Konkrétne zloženie slučiek závisí od sústavy, zapojenia a miesta merania.</text></svg>
