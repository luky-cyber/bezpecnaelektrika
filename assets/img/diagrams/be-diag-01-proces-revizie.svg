<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">Ako sa overuje elektrická inštalácia</title><desc id="desc">Päť navzájom sa doplňujúcich krokov: prehliadka, skúšanie, meranie, vyhodnotenie a dokumentácia. Žiadny krok sám osebe nestačí.</desc>
<style>
  .bg{fill:var(--diag-bg,#0f1821)} .line{stroke:var(--diag-line,rgba(174,211,218,.35));stroke-width:2;fill:none}
  .node{fill:var(--diag-bg,#0f1821);stroke:var(--diag-accent,#68ddd4);stroke-width:3}.node-eval{stroke:var(--diag-gold,#f0c56e)}
  .ey{font:800 13px Inter,system-ui,sans-serif;letter-spacing:2.2px;fill:var(--diag-accent,#68ddd4)}
  .h{font:800 30px Inter,system-ui,sans-serif;fill:var(--diag-text,#f1f6f7)}
  .note{font:500 16px Inter,system-ui,sans-serif;fill:var(--diag-muted,#a0b2bc)}
  .num{font:800 12px Inter,system-ui,sans-serif;fill:var(--diag-accent,#68ddd4)} .num-eval{fill:var(--diag-gold,#f0c56e)}
  .step{font:800 17px Inter,system-ui,sans-serif;fill:var(--diag-text,#f1f6f7)}
  .verb{font:700 13px Inter,system-ui,sans-serif;fill:var(--diag-accent,#68ddd4)}
  .body{font:500 13px Inter,system-ui,sans-serif;fill:var(--diag-muted,#a0b2bc)}
  .band{fill:var(--diag-band,rgba(104,221,212,.08));stroke:var(--diag-line,rgba(174,211,218,.35))}
</style>
<rect class="bg" width="1120" height="420" rx="28"/>
<text class="ey" x="56" y="54">PROCES REVÍZIE</text><text class="h" x="56" y="94">Ako sa overuje elektrická inštalácia</text>
<text class="note" x="56" y="126">Kroky sa dopĺňajú. Žiadny z nich sám osebe nestačí.</text>
<path class="line" d="M90 208 H1030"/><path d="M1030 208 l-12 -7 v14 z" fill="var(--diag-accent,#68ddd4)"/>
<!-- 01 --> <circle class="node" cx="120" cy="208" r="11"/><text class="num" x="92" y="176">01</text><text class="step" x="76" y="244">Prehliadka</text><text class="verb" x="91" y="269">vidieť</text><text class="body" x="54" y="293">stav · zapojenie · označenia</text><text class="body" x="69" y="311">viditeľné nedostatky</text>
<!-- 02 --> <circle class="node" cx="340" cy="208" r="11"/><text class="num" x="312" y="176">02</text><text class="step" x="299" y="244">Skúšanie</text><text class="verb" x="313" y="269">overiť</text><text class="body" x="276" y="293">funkcie a ochranné prvky</text><text class="body" x="282" y="311">nie iba pohľadom</text>
<!-- 03 --> <circle class="node" cx="560" cy="208" r="11"/><text class="num" x="532" y="176">03</text><text class="step" x="525" y="244">Meranie</text><text class="verb" x="515" y="269">získať údaje</text><text class="body" x="500" y="293">číselné údaje o vybraných</text><text class="body" x="526" y="311">vlastnostiach</text>
<!-- 04 --> <circle class="node node-eval" cx="780" cy="208" r="12"/><circle cx="780" cy="208" r="4" fill="var(--diag-gold,#f0c56e)"/><text class="num num-eval" x="752" y="176">04</text><text class="step" x="725" y="244">Vyhodnotenie</text><text class="verb" x="738" y="269">dať význam</text><text class="body" x="724" y="293">kontext inštalácie, nie</text><text class="body" x="735" y="311">izolované číslo</text>
<!-- 05 --> <circle class="node" cx="1000" cy="208" r="11"/><text class="num" x="972" y="176">05</text><text class="step" x="943" y="244">Dokumentácia</text><text class="verb" x="956" y="269">zachytiť stav</text><text class="body" x="930" y="293">zistenia · podmienky · záver</text><text class="body" x="953" y="311">v danom čase</text>
<rect class="band" x="56" y="350" width="1008" height="42" rx="14"/><text class="note" x="560" y="377" text-anchor="middle">Výsledok vzniká až spojením týchto krokov.</text>
</svg>