<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"><title>RCCB vs RCBO</title><desc>Porovnanie funkcií RCCB a RCBO. RCCB má reziduálnu ochrannú funkciu bez integrovanej nadprúdovej ochrany; RCBO kombinuje reziduálnu a nadprúdovú ochranu.</desc><style>.bg{fill:#0f1821}.box{fill:#13202b;stroke:#29424d;stroke-width:2}.t{fill:#f1f6f7;font-family:Inter,system-ui,sans-serif}.h{font-size:34px;font-weight:800}.m{font-size:23px;font-weight:800}.s{font-size:16px;fill:#a0b2bc}.pill{fill:#16363a;stroke:#68ddd4;stroke-width:2}.gold{fill:#3b3020;stroke:#f0c56e;stroke-width:2}</style><rect class="bg" width="1000" height="520" rx="28"/><text class="t h" x="55" y="62">RCCB vs RCBO</text><text class="t s" x="55" y="94">Rozdiel vo funkciách prístroja, nie univerzálny rebríček „lepší/horší“.</text><rect class="box" x="65" y="145" width="390" height="280" rx="24"/><text class="t m" x="95" y="190">RCCB</text><rect class="pill" x="95" y="225" width="300" height="62" rx="16"/><text class="t m" x="125" y="264">Reziduálna ochrana</text><text class="t s" x="95" y="335">Bez integrovanej nadprúdovej</text><text class="t s" x="95" y="360">ochrany príslušného obvodu.</text><rect class="box" x="545" y="145" width="390" height="280" rx="24"/><text class="t m" x="575" y="190">RCBO</text><rect class="pill" x="575" y="225" width="300" height="62" rx="16"/><text class="t m" x="605" y="264">Reziduálna ochrana</text><rect class="gold" x="575" y="302" width="300" height="62" rx="16"/><text class="t m" x="614" y="341">Nadprúdová ochrana</text><text class="t s" x="55" y="480">Vhodnosť konkrétneho riešenia závisí od návrhu a vlastností obvodu.</text></svg>
