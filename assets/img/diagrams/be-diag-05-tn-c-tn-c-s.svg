<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"><title>TN-C a TN-C-S</title><desc>Didaktická schéma: v časti TN-C je ochranná a neutrálna funkcia kombinovaná vo vodiči PEN; po určenom bode systému pokračujú PE a N oddelene.</desc><style>.bg{fill:#0f1821}.box{fill:#13202b;stroke:#29424d;stroke-width:2}.t{fill:#f1f6f7;font-family:Inter,system-ui,sans-serif}.h{font-size:34px;font-weight:800}.m{font-size:21px;font-weight:800}.s{font-size:16px;fill:#a0b2bc}.pen{stroke:#f0c56e;stroke-width:8;fill:none;stroke-linecap:round}.pe{stroke:#68ddd4;stroke-width:8;fill:none;stroke-linecap:round}.n{stroke:#82a9c0;stroke-width:8;fill:none;stroke-linecap:round}</style><rect class="bg" width="1000" height="520" rx="28"/><text class="t h" x="55" y="62">TN-C → TN-C-S</text><text class="t s" x="55" y="94">Terminologický princíp, nie realizačný návod.</text><rect class="box" x="65" y="145" width="350" height="260" rx="24"/><text class="t m" x="95" y="190">Časť TN-C</text><path class="pen" d="M110 275 H370"/><text class="t m" x="215" y="250">PEN</text><text class="t s" x="95" y="350">Ochranná a neutrálna funkcia</text><text class="t s" x="95" y="375">sú kombinované.</text><circle cx="500" cy="275" r="34" fill="#2e2a20" stroke="#f0c56e" stroke-width="3"/><text class="t m" x="478" y="282">bod</text><path class="pen" d="M415 275 H466"/><rect class="box" x="585" y="145" width="350" height="260" rx="24"/><text class="t m" x="615" y="190">Časť po oddelení</text><path class="pe" d="M534 258 H895"/><path class="n" d="M534 300 H895"/><text class="t m" x="700" y="245">PE</text><text class="t m" x="700" y="337">N</text><text class="t s" x="615" y="365">Ochranná a neutrálna funkcia</text><text class="t s" x="615" y="390">pokračujú oddelene.</text><text class="t s" x="55" y="475">Konkrétne podmienky a miesto vyhotovenia sa posudzujú podľa návrhu a použiteľných pravidiel.</text></svg>
